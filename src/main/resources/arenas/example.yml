# ── Times ──
teams:
  azul:
    color: "blue"
    spawn: "bw_example,5,65,5,0,0"
    spawn_block: "minecraft:stone"
    bed: "bw_example,5,64,5,0,0"
    bed_facing: "NORTH"
  vermelho:
    color: "red"
    spawn: "bw_example,-5,65,-5,0,0"
    spawn_block: "minecraft:stone"
    bed: "bw_example,-5,64,-5,0,0"
    bed_facing: "SOUTH"

# ── Spawn da arena / lobby ──
arena_spawn: "bw_example,0,65,0,0,0"
spawn_block: "minecraft:obsidian"
lobby: "world,0,64,0,0,0"

# ── Shop NPCs ──
shop: "default"
shop_npcs:
  0:
    location: "bw_example,3,65,3,0,0"
    skin: "Keeper"
    displayName: "<red>Loja</red>"

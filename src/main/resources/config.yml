# ─────────────────────────────────────
# Configuração global do BedWars
# ─────────────────────────────────────

# Idioma do plugin.
# O arquivo deve existir em: plugins/BedWars/lang/<idioma>.yml
lang: pt_BR

# Configurações das arenas
arena:
  limits:
    # Largura máxima da arena no eixo X (defina 0 para ilimitado)
    max-width: 1000
    # Altura máxima da arena no eixo Y (defina 0 para ilimitado)
    max-height: 384
    # Comprimento máximo da arena no eixo Z (defina 0 para ilimitado)
    max-length: 1000

# ===================================================================
# Geradores Globais
# ===================================================================
# Estes são os geradores espalhados pelo mapa (Ilhas de Diamante,
# Esmeralda, etc.).
#
# O material deve ser um Material válido da API do Bukkit/Paper.
# Os identificadores (iron, gold, diamond, emerald) são utilizados
# pelo sistema de autocomplete dos comandos.
generators:
  iron:
    material: IRON_INGOT
    interval: 40

  gold:
    material: GOLD_INGOT
    interval: 120

  diamond:
    material: DIAMOND
    interval: 600

  emerald:
    material: EMERALD
    interval: 1200

# ===================================================================
# Fornalha (Forge)
# ===================================================================
# Configuração da fornalha das ilhas dos jogadores.
#
# Cada nível melhora a velocidade de geração dos recursos da base.
# Os tipos disponíveis também são utilizados pelo autocomplete.

# ─────────────────────────────────────
# Configuração global do BedWars
# ─────────────────────────────────────

# Idioma do plugin.
# O arquivo deve existir em: plugins/BedWars/lang/<idioma>.yml
lang: pt_BR

# Geradores disponíveis no plugin.
# O material deve ser um Material válido da API do Bukkit/Paper.
generators:
  # Gerador de ferro.
  iron:
    material: IRON_INGOT

  # Gerador de ouro.
  gold:
    material: GOLD_INGOT

  # Gerador de diamante.
  diamond:
    material: DIAMOND

  # Gerador de esmeralda.
  emerald:
    material: EMERALD

# Configuração da fornalha (Forge).
# Cada melhoria aumenta a velocidade dos geradores da base.
forge:
  max-level: 10
  levels:
    1:
      iron:
        interval: 20
    2:
      iron:
        interval: 18
      gold:
        interval: 100
    3:
      iron:
        interval: 16
      gold:
        interval: 90
    4:
      iron:
        interval: 14
      gold:
        interval: 80
      diamond:
        interval: 1200
    5:

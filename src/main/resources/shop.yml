# ─────────────────────────────────────
# Shop Configuration for BedWars
# ─────────────────────────────────────
# Format inspired by ScreamingBedWars
#
# Each category has:
#   display-name - Display name (MiniMessage format)
#   icon - Material for the category item
#   lore - Lore lines (MiniMessage format)
#   items - List of items (can also be sub-categories)
#
# Each item can be:
#   Short stack: "material;amount;display-name;lore for <amount> <currency>"
#   Long stack:  stack: { type, amount, display-name, lore, enchants, tag }
#                price: "<amount> <currency>"
#
# Currencies: iron, gold, diamond, emerald
#
# Positioning: skip, column, row, linebreak (before/after/both),
#              pagebreak (before/after/both), absolute

displayName: "Loja > Compra"

categories:

  # ═══════════════════════════════════════
  # BLOCOS
  # ═══════════════════════════════════════

  blocks:
    display-name: "<bold><red>Blocos</red></bold>"
    icon: SANDSTONE
    lore:
      - "<gray>Compre blocos para</gray>"
      - "<gray>pontes e construcao</gray>"

    positioning:
      type: row
      center: true

    items:

      - stack:
          type: WHITE_WOOL
          amount: 4
          display-name: "<yellow>Bloco de lã</yellow>"
        price: 1 iron

      - stack:
          type: GLASS
          amount: 8
          display-name: "<yellow>Vidro</yellow>"
        price: 2 iron

      - stack:
          type: DIRT
          amount: 16
          display-name: "<yellow>Terra</yellow>"
        price: 4 iron

      - stack:
          type: END_STONE
          amount: 8
          display-name: "<yellow>Pedra do Fim</yellow>"
        price: 8 iron

      - stack:
          type: OAK_FENCE
          amount: 6
          display-name: "<yellow>Cerca</yellow>"
        price: 1 gold

      - stack:
          type: OAK_PLANKS
          amount: 6
          display-name: "<yellow>Tábuas</yellow>"
        price: 2 gold

      - stack:
          type: OBSIDIAN
          amount: 1
          display-name: "<yellow>Obsidiana</yellow>"
        price: 1 emerald


  # ═══════════════════════════════════════
  # ARMAS
  # ═══════════════════════════════════════

  weapons:
    display-name: "<bold><red>Armas</red></bold>"
    icon: IRON_SWORD

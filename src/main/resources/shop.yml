# ─────────────────────────────────────
# Shop Configuration for BedWars
# ─────────────────────────────────────
# Format inspired by ScreamingBedWars
#
# Each category has:
#   display-name - Display name (MiniMessage format)
#   icon - Material for the category item
#   lore - Lore lines (MiniMessage format)
#   items - List of items (can also be sub-categories)
#
# Each item can be:
#   Short stack: "material;amount;display-name;lore for <amount> <currency>"
#   Long stack:  stack: { type, amount, display-name, lore, enchants, tag }
#                price: "<amount> <currency>"
#
# Currencies: iron, gold, diamond, emerald
#
# Positioning: skip, column, row, linebreak (before/after/both),
#              pagebreak (before/after/both), absolute


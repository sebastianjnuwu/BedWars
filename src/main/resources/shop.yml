            - ""
            - "<yellow>Contém:</yellow>"
            - "<gray>• Capacete de Ouro</gray>"
            - "<gray>• Peitoral de Ouro</gray>"
            - "<gray>• Calça de Ouro</gray>"
            - "<gray>• Botas de Ouro</gray>"
            - ""
            - "<yellow>Clique para comprar</yellow>"

          items:

            - stack:
                type: GOLDEN_HELMET
                display-name: "<yellow>Capacete de Ouro</yellow>"

            - stack:
                type: GOLDEN_CHESTPLATE
                display-name: "<yellow>Peitoral de Ouro</yellow>"

            - stack:
                type: GOLDEN_LEGGINGS
                display-name: "<yellow>Calça de Ouro</yellow>"

            - stack:
                type: GOLDEN_BOOTS
                display-name: "<yellow>Botas de Ouro</yellow>"

        price: 6 gold


      # ─────────────────────────────────
      # DIAMANTE
      # ─────────────────────────────────

      - stack:
          type: DIAMOND_CHESTPLATE
          display-name: "<aqua><bold>Conjunto de Diamante</bold></aqua>"
          lore:
            - "<gray>Armadura completa de diamante</gray>"
            - ""
            - "<aqua>Contém:</aqua>"
            - "<gray>• Capacete de Diamante</gray>"
            - "<gray>• Peitoral de Diamante</gray>"
            - "<gray>• Calça de Diamante</gray>"
            - "<gray>• Botas de Diamante</gray>"
            - ""
            - "<yellow>Clique para comprar</yellow>"

          items:

            - stack:
                type: DIAMOND_HELMET
                display-name: "<aqua>Capacete de Diamante</aqua>"

            - stack:
                type: DIAMOND_CHESTPLATE
                display-name: "<aqua>Peitoral de Diamante</aqua>"

            - stack:
                type: DIAMOND_LEGGINGS
                display-name: "<aqua>Calça de Diamante</aqua>"

            - stack:
                type: DIAMOND_BOOTS
                display-name: "<aqua>Botas de Diamante</aqua>"

        price: 8 emerald


  # ═══════════════════════════════════════
  # FERRAMENTAS
  # ═══════════════════════════════════════

  tools:
    display-name: "<bold><red>Ferramentas</red></bold>"
    icon: DIAMOND_PICKAXE
    lore:
      - "<gray>Compre ferramentas</gray>"
      - "<gray>para coletar recursos</gray>"

    positioning:
      type: row
      center: true

    items:

      - stack:
          type: WOODEN_PICKAXE
          display-name: "<yellow>Picareta</yellow>"
          enchants:
            efficiency: 1
        price: 5 iron

      - stack:
          type: IRON_PICKAXE
          display-name: "<yellow>Picareta de Ferro</yellow>"

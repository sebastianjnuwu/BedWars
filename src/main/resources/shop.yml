      - "<gray>Compre armas para</gray>"
      - "<gray>derrotar seus inimigos</gray>"

    positioning:
      type: row
      center: true

    items:

      - stack:
          type: STONE_SWORD
          display-name: "<yellow>Espada de Pedra</yellow>"
        price: 10 iron

      - stack:
          type: IRON_SWORD
          display-name: "<yellow>Espada de Ferro</yellow>"
        price: 3 gold

      - stack:
          type: DIAMOND_SWORD
          display-name: "<yellow>Espada de Diamante</yellow>"
        price: 2 emerald

      - stack:
          type: BOW
          display-name: "<yellow>Arco</yellow>"
        price: 4 gold

      - stack:
          type: ARROW
          amount: 8
          display-name: "<yellow>Flechas</yellow>"
        price: 1 gold

      - stack:
          type: IRON_AXE
          display-name: "<yellow>Machado de Ferro</yellow>"
        price: 1 gold

      - stack:
          type: DIAMOND_AXE
          display-name: "<yellow>Machado de Diamante</yellow>"
        price: 2 emerald

      - stack:
          type: STONE_PICKAXE
          display-name: "<yellow>Picareta de Pedra</yellow>"
        price: 10 iron

      - stack:
          type: SHEARS
          display-name: "<yellow>Tesoura</yellow>"
        price: 10 iron

      - stack:
          type: STICK
          amount: 2
          display-name: "<yellow>Vara de Empurrar</yellow>"
        price: 2 gold

      - stack:
          type: FISHING_ROD
          display-name: "<yellow>Vara de Pescar</yellow>"
        price: 3 gold

      - stack:
          type: FIRE_CHARGE
          display-name: "<yellow>Bola de Fogo</yellow>"
        price: 1 gold


  # ═══════════════════════════════════════
  # ARMADURAS
  # ═══════════════════════════════════════

  armor:
    display-name: "<bold><red>Armaduras</red></bold>"
    icon: DIAMOND_CHESTPLATE
    lore:
      - "<gray>Compre conjuntos completos</gray>"
      - "<gray>de armaduras para sua batalha</gray>"

    positioning:
      type: row
      center: true

    items:

      # ─────────────────────────────────
      # FERRO
      # ─────────────────────────────────

      - stack:
          type: IRON_CHESTPLATE
          display-name: "<white><bold>Conjunto de Ferro</bold></white>"
          lore:
            - "<gray>Armadura completa de ferro</gray>"
            - ""
            - "<white>Contém:</white>"
            - "<gray>• Capacete de Ferro</gray>"
            - "<gray>• Peitoral de Ferro</gray>"
            - "<gray>• Calça de Ferro</gray>"
            - "<gray>• Botas de Ferro</gray>"
            - ""
            - "<yellow>Clique para comprar</yellow>"

          items:

            - stack:
                type: IRON_HELMET
                display-name: "<white>Capacete de Ferro</white>"

            - stack:
                type: IRON_CHESTPLATE
                display-name: "<white>Peitoral de Ferro</white>"

            - stack:
                type: IRON_LEGGINGS
                display-name: "<white>Calça de Ferro</white>"

            - stack:
                type: IRON_BOOTS
                display-name: "<white>Botas de Ferro</white>"

        price: 4 gold


      # ─────────────────────────────────
      # OURO
      # ─────────────────────────────────

      - stack:

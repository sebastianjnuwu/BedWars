name: Build & Lint

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Lint + Compile (Checkstyle on validate)
        run: mvn -q clean compile -DskipTests

      - name: Package (shaded JAR)
        run: mvn -q clean package -DskipTests

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BedWars-1.0.0
          path: target/sBedWars-1.0.0.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package JAR
        run: mvn -q clean package -DskipTests

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: target/sBedWars-1.0.0.jar
          generate_release_notes: true
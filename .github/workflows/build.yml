name: Build & Lint

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Lint + Compile (Checkstyle on validate)
        run: mvn -q clean compile -DskipTests

      - name: Package (shaded JAR)
        run: mvn -q clean package -DskipTests

      - name: Resolve plugin version
        id: version
        run: echo "version=$(mvn -q help:evaluate -Dexpression=revision -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sBedWars-v${{ steps.version.outputs.version }}
          path: core/target/sBedWars-*.jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package JAR
        run: mvn -q clean package -DskipTests

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: core/target/sBedWars-*.jar
          generate_release_notes: true